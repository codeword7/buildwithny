# Clean URL redirects (so /audit works without .html)
[[redirects]]
  from = "/audit"
  to = "/audit.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Blog clean URLs
[[redirects]]
  from = "/blog"
  to = "/blog/index.html"
  status = 200

[[redirects]]
  from = "/blog/document-collection-automation"
  to = "/blog/document-collection-automation.html"
  status = 200

# Tools clean URLs
[[redirects]]
  from = "/tools/document-chasing-cost-calculator"
  to = "/tools/document-chasing-cost-calculator.html"
  status = 200

# 404 fallback — send unknown paths to home
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
