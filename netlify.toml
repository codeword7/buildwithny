# Clean URL redirects (so /audit works without .html)
[[redirects]]
  from = "/audit"
  to = "/audit.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# 404 fallback — send unknown paths to home
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
